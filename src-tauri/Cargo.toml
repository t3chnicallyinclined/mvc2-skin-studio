[package]
name = "mvc2-skin-studio"
version = "0.1.0"
description = "MVC2 Skin Studio — desktop sprite editor"
authors = ["tristech"]
edition = "2021"
rust-version = "1.77"

# The library the desktop binary (and any future mobile entry point) calls into.
[lib]
name = "mvc2_skin_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Smaller, faster release binary for distribution.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
