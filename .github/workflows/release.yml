name: release

# Push a version tag (e.g. v0.1.0) to build installers for all three OSes and attach them to a
# GitHub Release. The frontend is staged into src-tauri/wwwroot by build.rs (pure Rust, no Node/Python).
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest        # universal .dmg (Intel + Apple Silicon)
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04         # .AppImage + .deb (+ .rpm)
            args: ''
          - platform: windows-latest       # .msi + NSIS .exe
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build the app and publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MvC2 Skin Studio ${{ github.ref_name }}'
          releaseBody: |
            Edit **Marvel vs. Capcom 2** character sprites (recolor the palette **and** paint the pixels) and bake them straight into your own Dreamcast GDI to play on **flycast** or real hardware. Runs locally.

            > **BYOR** — these builds ship **no game data**. You supply your own legally-owned MVC2 disc's `track03.bin`.

            ### Install
            - **Windows** — `.msi` or `-setup.exe`
            - **macOS** — `.dmg` (universal). Unsigned: **right-click → Open** the first time.
            - **Linux** — `.AppImage` or `.deb`

            Then: **launch → 📂 load track03.bin → edit → ⬇ bake to ROM**. Loading the ROM decodes every character **in-app** — no Python, no server, no pre-processing.

            ### Features
            - **Editor** — Aseprite-style layout (tool rail, palette dock, responsive canvas, contextual options, live preview + navigator minimap, frame timeline); paint on the assembled animated sprite; shared-part edits ripple across every frame with an amber/blue impact view.
            - **Tools** — pencil, fill (solid / dither / dithered gradient), pick, eraser, pan; line / rectangle / ellipse; marquee copy → stamp (flip/rotate); PNG stickers; region-select across an animation; propagate; undo + redo; keyboard shortcuts; symmetry (with axis guide); pixel-perfect pencil; shading ink; visual brush sizes + a live brush cursor; move/nudge.
            - **Colour & palette** — FG/BG chip (X to swap), right-click swatch to recolour live, recolor-all (HSL), swap N→M, shading ramp, alt-costume, import/export (`.hex`/`.gpl`/`.pal`/PNG), palette-from-image, all palette banks (PalMod names).
            - **Animation & view** — frame timeline, live looping preview, onion skin (±N), playback speed, scroll-zoom to cursor, fit/1×, grid, diff view, flip, reference-image overlay, focus mode, right/middle/space pan.
            - **Save / export** — multi-character project save/open + autosave; export frame PNG / animation sheet / **animated GIF** / skin.json / palette; one-click **bake to ROM** in place with an automatic `track03.bin.bak`.
            - **Cross-platform** — native Windows / macOS / Linux (Tauri).

            Full details in the [CHANGELOG](https://github.com/t3chnicallyinclined/mvc2-skin-studio/blob/master/CHANGELOG.md).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
